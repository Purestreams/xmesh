<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title data-i18n>XMesh · 网络监控</title>
  <link rel="stylesheet" href="/assets/monitor.css">
  <script src="/assets/monitor.js" defer></script>
<link rel="stylesheet" href="/assets/i18n.css"><script src="/assets/i18n.js"></script></head>
<body>
  <header><div class="brand">◈ XMesh <span data-i18n>NETWORK MONITOR</span></div><div class="header-actions"><select class="language-select" data-language-select aria-label="Language"><option value="zh">中文</option><option value="en">English</option></select><span class="readonly" data-i18n>监控</span></div></header>
  <main>
    <div class="heading"><div><p class="eyebrow" data-i18n>NETWORK / LIVE STATUS</p><h1 data-i18n>网络连接状态</h1><p class="muted" data-i18n>查看入口与出口之间的隧道状态和往返延迟。</p></div><div class="refresh"><button id="refresh" type="button" data-i18n>刷新状态</button><p id="updated" role="status" data-i18n>正在获取状态…</p></div></div>
    <div id="notice" class="notice" role="alert" hidden></div>
    <noscript><p class="notice">请启用 JavaScript 查看实时监控。</p></noscript>
    <div id="metrics" class="metrics" aria-label="网络概览" data-i18n-aria-label="网络概览"></div>
    <section><h2 data-i18n>节点状态</h2><div id="nodes" class="nodes"><p class="muted" data-i18n>正在加载节点…</p></div></section>
    <section><div class="section-heading"><div><h2 data-i18n>链路矩阵</h2><p class="muted" data-i18n>点击已发布的节点组合，查看各条 Link 和延迟趋势。</p></div><label class="search"><span data-i18n>搜索公开名称</span><input id="search" type="search" placeholder="节点或链路名称" data-i18n-placeholder="节点或链路名称" maxlength="48"></label></div><div id="matrix" class="table-scroll"><p class="muted" data-i18n>正在加载链路…</p></div><p class="legend" data-i18n>● 就绪　◐ 待就绪　○ 离线　◌ 数据过期　— 未发布链路 / 无测量</p></section>
    <section id="detail" hidden><div class="section-heading"><h2 id="detail-title" tabindex="-1" data-i18n>链路详情</h2><button id="close-detail" type="button" class="secondary" data-i18n>关闭详情</button></div><div id="detail-body"></div></section>
    <footer><span data-i18n>Agent 延迟为隧道 RTT；外部出口为经上游访问 ip.sb 的 HTTPS 耗时。页面每 15 秒刷新。</span><br><span data-i18n>历史保留近 24 小时，约每 5 分钟采样；未完成测试的外部线路显示“未探测”。</span></footer>
  </main>
</body>
</html>
