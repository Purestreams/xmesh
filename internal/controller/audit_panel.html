<section id="user-audit" data-page="users"><h2 data-i18n>用户审计</h2><p class="muted" data-i18n>默认关闭。按用户合并 Agent 出口的连接与解析记录，日志和压缩归档合计默认最多 20MB。外部出口未覆盖。</p><table><thead><tr><th data-i18n>用户</th><th data-i18n>审计状态</th><th data-i18n>容量上限</th><th data-i18n>操作</th></tr></thead><tbody>{{range .UserList}}<tr><td>{{.Name}}<br><code>{{.ID}}</code></td><td>{{if .AuditEnabled}}<span data-i18n>已开启</span>{{else}}<span data-i18n>已关闭</span>{{end}}</td><td>{{if .AuditLimitMB}}{{.AuditLimitMB}}{{else}}20{{end}} MB</td><td><a href="/admin/users/{{.ID}}/audit" data-i18n>查看与设置审计</a></td></tr>{{else}}<tr><td colspan="4" data-i18n>暂无用户</td></tr>{{end}}</tbody></table></section>
