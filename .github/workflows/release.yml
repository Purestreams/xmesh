name: release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
      - run: mise exec -- go test ./...
      - run: mise exec -- go vet ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/panel.test.cjs tests/i18n.test.cjs
      - name: Build pinned Gateway Xray with the patched toolchain and dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p xray-build/amd64 xray-build/arm64
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" mise exec -- go -C build/gateway-xray build -mod=readonly -trimpath -ldflags '-s -w' -o "$PWD/xray-build/$arch/xray" github.com/xtls/xray-core/main
          done
      - name: Package Linux amd64/arm64 and Windows amd64
        shell: bash
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"
          XRAY_AMD64="$PWD/xray-build/amd64/xray" XRAY_ARM64="$PWD/xray-build/arm64/xray" mise exec -- sh scripts/package.sh "$version"
          for arch in amd64 arm64; do
            tar -tzf "dist/xmesh-${version}-linux-${arch}.tar.gz" | grep -Fx controller-updater.sh
            tar -tzf "dist/xmesh-${version}-linux-${arch}.tar.gz" | grep -Fx xmesh-updater
          done
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
