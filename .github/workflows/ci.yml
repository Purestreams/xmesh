name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
      - run: mise exec -- go test ./...
      - run: mise exec -- go vet ./...
      - name: REALITY end-to-end in Docker
        run: |
          docker build -f tests/reality/Dockerfile -t xmesh-reality-test:ci tests/reality
          docker run --rm --mount "type=bind,source=$PWD,target=/src" xmesh-reality-test:ci
      - run: sh -n scripts/install.sh scripts/install-controller.sh scripts/install-docker.sh scripts/backup-controller.sh scripts/controller-updater.sh scripts/package.sh tests/install_docker_rollback.sh tests/controller_updater.sh
      - run: sudo sh tests/install_docker_rollback.sh
      - run: sudo sh tests/controller_updater.sh
      - run: docker run --rm --mount "type=bind,source=$PWD,target=/src" -w /src golang:1.27.1-bookworm sh tests/controller_updater_install.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: xmesh-linux-amd64
            output: dist/xmesh-linux-amd64
          - goos: linux
            goarch: arm64
            artifact: xmesh-linux-arm64
            output: dist/xmesh-linux-arm64
          - goos: windows
            goarch: amd64
            artifact: xmesh-windows-amd64
            output: dist/xmesh-windows-amd64.exe
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
      - name: Build ${{ matrix.goos }} ${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          mise exec -- go build -trimpath -ldflags="-s -w" -o "${{ matrix.output }}" ./cmd/xmesh
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 14
